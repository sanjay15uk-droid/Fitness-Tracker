<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matchday — Training Tracker</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0E0F11" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Matchday" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <span class="brand">MATCHDAY</span>
      <span class="brand-sub">Training log</span>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="dashboard">Today</button>
    <button class="tab-btn" data-tab="workout">Session</button>
    <button class="tab-btn" data-tab="meals">Meals</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
  </nav>

  <div id="dateNav" class="date-nav"></div>

  <main class="tab-content">
    <section id="dashboard" class="tab-panel active"></section>
    <section id="workout" class="tab-panel"></section>
    <section id="meals" class="tab-panel"></section>
    <section id="settings" class="tab-panel"></section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
